packages:
  - .

onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - esbuild

blockExoticSubdeps: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@usehercules/*"
allowBuilds:
  '@clerk/shared': set this to true or false
  '@swc/core': set this to true or false
  esbuild: set this to true or false
